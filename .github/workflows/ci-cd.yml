name: CI/CD Sistema Restaurante

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  calidad-pruebas:
    name: Calidad, pruebas, cobertura y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Pruebas unitarias
        run: |
          mkdir -p artifacts/evidencias
          npm test 2>&1 | tee artifacts/evidencias/pruebas-node.txt
      - name: Cobertura de reglas POS
        run: npm run test:coverage
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Construir aplicación
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aplicacion-compilada
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-calidad
          path: artifacts/evidencias/

  staging:
    name: Validar paquete en staging
    needs: calidad-pruebas
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: aplicacion-compilada
          path: dist/
      - name: Servir paquete y comprobar disponibilidad
        run: |
          npx vite preview --host 127.0.0.1 --port 8080 > /tmp/mesa-lista-staging.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/staging.html; then break; fi
            sleep 2
          done
          grep -q "Mesa Lista" /tmp/staging.html
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          echo "Staging validado: HTTP 200 y paquete Mesa Lista disponible"

# La entrega continua de producción la realiza la integración nativa GitHub–Vercel.
# Vercel construye y publica main únicamente después de recibir el commit en GitHub.
