name: CI/CD Sistema Restaurante

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: src

jobs:
  calidad-pruebas:
    name: Build, calidad, pruebas y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Construcción y análisis estático
        run: python -m compileall -q src && ruff check src tests scripts
      - name: Pruebas unitarias e integración con cobertura
        run: |
          coverage run -m pytest -q --junitxml=artifacts/evidencias/pytest.xml
          coverage report --fail-under=85
          coverage xml -o artifacts/evidencias/cobertura.xml
      - name: Seguridad estática y dependencias
        run: |
          bandit -q -r src -f json -o artifacts/evidencias/bandit.json
          pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-calidad
          path: artifacts/evidencias/

  empaquetado:
    name: Empaquetar artefactos
    needs: calidad-pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build==1.3.0 && python -m build
      - run: docker build -t sistema-restaurante:${{ github.sha }} .
      - run: docker save sistema-restaurante:${{ github.sha }} -o sistema-restaurante.tar
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-aplicacion
          path: |
            dist/
            sistema-restaurante.tar

  staging:
    name: Desplegar y validar staging
    needs: empaquetado
    runs-on: ubuntu-latest
    environment: staging
    env:
      URL_STAGING: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paquete-aplicacion
      - run: docker load -i sistema-restaurante.tar
      - name: Despliegue controlado
        run: docker run -d --name restaurante -p 8080:8080 -e AUTENTICACION_CLAVE=${{ secrets.CLAVE_STAGING }} sistema-restaurante:${{ github.sha }}
      - name: Esperar servicio saludable
        run: |
          for i in {1..20}; do
            curl --fail http://localhost:8080/api/salud && exit 0
            sleep 2
          done
          exit 1
      - name: Prueba funcional y de rendimiento
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validar_staging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-staging
          path: artifacts/evidencias/staging.json
      - if: always()
        run: docker rm -f restaurante

  produccion:
    name: Desplegar en Vercel
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar configuración del proyecto
        run: npx --yes vercel@latest pull --yes --environment=production
      - name: Construir funciones serverless
        run: npx --yes vercel@latest build --prod
      - name: Desplegar producción
        id: vercel
        run: echo "url=$(npx --yes vercel@latest deploy --prebuilt --prod)" >> "$GITHUB_OUTPUT"
      - name: Comprobar API desplegada
        run: curl --fail --retry 5 --retry-delay 3 "${{ steps.vercel.outputs.url }}/api/salud"
