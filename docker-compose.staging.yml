services:
  restaurante:
    build: .
    image: sistema-restaurante:staging
    ports:
      - "8080:8080"
    environment:
      AUTENTICACION_USUARIO: admin
      AUTENTICACION_CLAVE: ${AUTENTICACION_CLAVE:-staging-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/salud')"]
      interval: 10s
      timeout: 3s
      retries: 5
